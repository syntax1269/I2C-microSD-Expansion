sentence=Arduino host library for the I²C microSD Expansion — SD-card storage over just 2 wires (I2C).
paragraph=Host-side file API over the I²C microSD Expansion module. Zero heap, fixed buffers, no String. Open files, write/read, list directories and query card info — the module handles the FAT filesystem; your sketch does not.
