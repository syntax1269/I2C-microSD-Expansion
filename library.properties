sentence=Arduino host library for the I²C microSD Expansion — SD-card storage over just 2 wires (I2C).
paragraph=File-style host API over the I²C microSD Expansion module. Print speed plateau of any stock driver, then drop in. Zero heap, fixed buffers, no String. Open files, write/read, list directories, query card info — the module handles the FAT filesystem; your sketch does not.
